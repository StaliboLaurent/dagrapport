<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1F3A5F">
<meta name="mobile-web-app-capable" content="yes">
<title>Werfverslag</title>
<style>
:root{--ink:#1B2430;--muted:#5B6573;--line:#E1DED6;--bg:#F4F3EF;--card:#fff;--navy:#1F3A5F;--ok:#1B5E34;--okbg:#DDF1E3;--bad:#8A1C13;--badbg:#FDECEA;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.top{background:var(--navy);color:#fff;padding:16px 16px 18px;padding-top:max(16px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
.top .t{flex:1 1 auto;min-width:0}
.top small{opacity:.8;font-size:13px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.top h1{font-size:22px;font-weight:700;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sub{opacity:.9;font-size:15px;margin-top:2px}
.top .back{min-height:44px;min-width:44px;border:none;background:rgba(255,255,255,.12);color:#fff;border-radius:10px;font-weight:600;padding:0 12px;cursor:pointer}
.wrap{padding:12px 12px 130px;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{font-size:17px;font-weight:700;margin-bottom:10px}
.lab{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.in{width:100%;height:50px;border:1px solid #B9B5AB;border-radius:10px;padding:0 12px;background:#fff;font-size:16px}
textarea.in{height:auto;min-height:96px;padding:10px 12px;resize:vertical;line-height:1.4}
.row{display:flex;gap:10px}
.row>*{flex:1 1 0;min-width:0}
.hint{font-size:14px;color:var(--muted)}
.btn{min-height:48px;padding:0 18px;border-radius:10px;border:1px solid #C9C5BA;background:#fff;font-weight:600;color:var(--navy);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.wa{background:#1F8F4E;border-color:#1F8F4E;color:#fff}
.btn.dash{border:1.5px dashed #8A93A0;width:100%}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px}
.btn.dng{color:var(--bad)}
.btn.full{width:100%}
.btn:disabled{opacity:.45}
.btn svg{width:20px;height:20px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{min-height:38px;padding:0 14px;border-radius:19px;border:1.5px solid #C9C5BA;background:#fff;color:var(--muted);font-weight:600;cursor:pointer;font-size:14px}
.chip.on{background:#DCE6F2;border-color:var(--navy);color:var(--navy)}
.pt{display:flex;flex-direction:column;gap:12px}
.pt .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pt .hd b{font-size:17px}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph div{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;background:#E8E6DF}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:4px;right:4px;width:34px;height:34px;border-radius:17px;border:none;background:rgba(27,36,48,.72);color:#fff;font-size:18px;line-height:1;cursor:pointer}
.pbtn{display:flex;gap:8px}
.pbtn label{flex:1 1 0}
.pbtn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;cursor:pointer;min-height:64px}
.item .m{flex:1 1 auto;min-width:0}
.item b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item span.s{display:block;font-size:14px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.tg{white-space:nowrap;display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:600;background:#EEF2F7;color:#3D4B5C}
.tg.ok{background:var(--okbg);color:var(--ok)}
.tg.new{background:#E6E0F5;color:#43307A}
.grp{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:6px 2px 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));z-index:10}
.bar .in2{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.bar .btn{width:100%}
.warn{background:var(--badbg);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:14px}
.okmsg{background:var(--okbg);color:var(--ok);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
.toast{position:fixed;left:12px;right:12px;bottom:calc(96px + env(safe-area-inset-bottom));max-width:616px;margin:0 auto;background:#1B2430;color:#fff;border-radius:12px;padding:12px 14px;font-size:15px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.busy{position:fixed;inset:0;background:rgba(244,243,239,.75);display:flex;align-items:center;justify-content:center;z-index:30;font-weight:700;color:var(--navy);font-size:17px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
</style>
</head>

    img.onerror=function(){if(typeof src!=='string')URL.revokeObjectURL(url);rej(new Error('Deze foto kon niet gelezen worden.'));};

    case 'delv-no':ui.delV=false;render();break;
    case 'delv-yes':var dv=cur;allPh(dv).forEach(function(f){delF(f).catch(function(){});delete F[f];});
      delV(dv.id).catch(function(){});V=V.filter(function(x){return x.id!==dv.id;});cur=null;ui.delV=false;ui.v='home';render();toast('Verslag gewist.');break;
    case 'pdf':makePdf();break;
    case 'share':sharePdf();break;
    case 'dl':dlPdf();break;
  }
});
document.addEventListener('input',function(e){
  var el=e.target,d=el.dataset||{};
  if(d.g==='q'){ui.q=el.value;render();return;}
  if(d.g==='naam'){lsSet(NK,el.value.trim());return;}
  if(d.n!==undefined&&ui.nw){ui.nw[d.n]=el.value;return;}
  if(!cur)return;
  if(d.v){cur[d.v]=el.value;save();return;}
  if(d.f){var p=cur.pts[+d.i];if(!p)return;p[d.f]=el.value;save();if(el.tagName==='TEXTAREA'){el.style.height='auto';el.style.height=Math.max(96,el.scrollHeight+2)+'px';}
    if(d.f==='who'){var cs=el.parentNode.querySelectorAll('.chip');Array.prototype.forEach.call(cs,function(c){c.classList.toggle('on',norm(c.dataset.n)===norm(el.value));});}}
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.json){loadJson(el.files&&el.files[0]);el.value='';return;}
  if(el.dataset&&el.dataset.ph!==undefined){addPhotos(el.dataset.ph,el.files);el.value='';return;}
  if(cur&&el.dataset&&(el.dataset.v==='d'||el.dataset.v==='t'))render();
  if(cur&&el.dataset&&el.dataset.f==='who')useName(el.value);
});

/* ---------- start ---------- */
render();
allV().then(function(a){V=a||[];render();}).catch(function(){toast('Deze browser laat niet toe om verslagen te bewaren.');});
if(navigator.storage&&navigator.storage.persist){try{navigator.storage.persist();}catch(e){}}
})();
</script>
